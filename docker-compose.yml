# docker-compose.yml
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-golf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-golf}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-golf} -d ${DB_NAME:-golf}"]
      interval: 5s
      retries: 5

volumes:
  pgdata: